# Rate limiting zones
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=forms:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # SecuNX IP blocklist
    include /etc/nginx/secuNX/blocklist.conf;

    # Custom 404 page
    error_page 404 /404.php;
    location = /404.php {
        internal;
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # File upload size
    client_max_body_size 50M;
    client_body_temp_path /tmp/nginx_client_body;
    client_body_buffer_size 2M;

    # Deny access to sensitive files
    location ~ /\.(env|git|htaccess|gitignore)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny hidden files/dirs
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block WordPress scanners
    location ~* ^/(wp-admin|wp-login\.php|wp-content|wp-includes|xmlrpc\.php|wp-config|wordpress|wp-json|wp-cron\.php)(/|$) {
        access_log off;
        log_not_found off;
        return 410;
    }

    # Block CMS/vulnerability scans
    location ~* ^/(phpmyadmin|pma|myadmin|mysql|admin\.php|administrator|joomla|drupal|magento|\.aws|\.ssh|config\.php|install\.php|setup\.php|shell\.php)(/|$) {
        access_log off;
        log_not_found off;
        return 410;
    }

    # Rate limit: Admin login (5 attempts per minute)
    location = /admin/login {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    # Rate limit: Checkout and contact forms (30 per minute)
    location ~* ^/(checkout|contact|register|forgot-password) {
        limit_req zone=forms burst=10 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    # Plugin assets
    location ^~ /content/plugins/ {
        alias /var/www/html/content/plugins/;
        location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|webp|woff|woff2)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
        }
        location ~* \.php$ {
            return 403;
        }
    }

    # Theme assets (thumbnails, screenshots, CSS, JS, images)
    location ^~ /content/themes/ {
        alias /var/www/html/content/themes/;
        location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|webp|woff|woff2)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
        }
        location ~* \.php$ {
            return 403;
        }
    }

    # Static file caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
        access_log off;
    }

    # Google Merchant Feed
    location = /google-merchant-feed.xml {
        default_type application/xml;
        expires 1h;
    }

    # PHP-FPM handling
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    # Front controller (general rate limit: 10 req/sec)
    location / {
        limit_req zone=general burst=20 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }
}
