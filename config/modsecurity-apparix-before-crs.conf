# Apparix ModSecurity exclusions
#
# Load this file before the OWASP Core Rule Set. PHP session IDs are random,
# opaque values and can accidentally contain a PHP function name such as
# "rtrim", causing CRS rule 933150 to block a legitimate request.
#
# This excludes only the PHPSESSID cookie from rule 933150. All request
# parameters, request bodies, and other cookies remain inspected.
SecRule REQUEST_HEADERS:Host "@rx .+" \
    "id:2100001,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetById=933150;REQUEST_COOKIES:PHPSESSID"
